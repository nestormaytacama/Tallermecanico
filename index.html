    <meta name="description" content="Aplicación web para gestionar servicios de un taller automotriz con almacenamiento, historial, consulta y edición directa en Google Sheets." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('autoregistro_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F8] text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased transition-colors duration-150">

  </body>
